name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: typecheck · test · build · prisma
    runs-on: ubuntu-latest
    env:
      # Prisma client generate + build don't need a live DB; `prisma validate`
      # only parses schema.prisma. DATABASE_URL is required by the client env.
      DATABASE_URL: postgresql://cfo:cfo_secret@localhost:5432/cfo_sentinel?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma schema validate
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
